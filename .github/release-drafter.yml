---
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
sort-direction: ascending

categories:
  - title: "🚨 Breaking changes"
    when:
      labels:
        - "breaking-change"
  - title: "✨ New features"
    when:
      labels:
        - "new-feature"
  - title: "🐛 Bug fixes"
    when:
      labels:
        - "bugfix"
  - title: "🚀 Enhancements"
    when:
      labels:
        - "enhancement"
        - "refactor"
        - "performance"
  - title: "🧰 Maintenance"
    when:
      labels:
        - "maintenance"
        - "ci"
  - title: "📚 Documentation"
    when:
      labels:
        - "documentation"
  - title: "⬆️ Dependency updates"
    collapse-after: 2
    when:
      labels:
        - "dependencies"

  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels:
        - "major"

  - type: "version-resolver"
    semver-increment: "minor"
    when:
      labels:
        - "minor"

  - type: "version-resolver"
    semver-increment: "patch"
    when:
      labels:
        - "fix"
        - "bugfix"
        - "chore"
        - "ci"
        - "dependencies"
        - "documentation"
        - "enhancement"
        - "patch"
        - "performance"
        - "refactor"

autolabeler:
  - label: "maintenance"
    files:
      - "*.md"
      - ".github/*"
      - ".ruff.toml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"

  - label: "bugfix"
    title:
      - "/fix/i"
  - label: "code quality"
    title:
      - "lint"
  - label: "development tools"
    files:
      - ".devcontainer/*"
      - ".devcontainer.json"
      - "Makefile"
      - "setup.cfg"
      - "pyproject.toml"

template: |
  <!--
  ### Checklist for release
  - Run make bump - select proper variant in Makefile
  - Review the draft below and update if needed
  -->

  ## Notable Changes

  $CHANGES
